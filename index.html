mimicText:"Anxiety disorders, depression, bipolar disorder, sleep deprivation or apnea, thyroid dysfunction, trauma responses, and substance use can all produce attention, restlessness, or impulsivity symptoms that look like ADHD but need a different treatment path. The Other Possible Causes tab in this tool gives you a first look at whether these might be part of your picture too.",

sourcesTitle:"Sources & Methodology",
sourcesDesc:"A plain account of what in this tool is grounded in published research, and what's original content built around that research — so you, and any clinician you show this to, know exactly what weight to give each part.",
sourcesBasisTitle:"What each section is based on",
sourcesBasisCol1:"Section", sourcesBasisCol2:"Basis",
sourcesBasisRows:[
["Reflect (18 items)","Item wording is original, written in plain language — not copied from any licensed instrument. The structure (9 inattention / 9 hyperactivity-impulsivity items) and the flagging threshold (5 of 9 per domain) match the DSM-5-TR's own published adult diagnostic criteria."],
["Childhood Patterns (10 items)","Original wording. DSM-5-TR requires childhood-onset symptoms for a diagnosis but doesn't set a specific item-count threshold for retrospective recall — the flagging threshold here (5 of 10) is an informal midpoint, not a published cutoff."],
["Other Possible Causes (12 items)","Original 3-item analogs for anxiety, mood, sleep, and other patterns. Real validated screeners for each of these conditions use 7-9 items and have established, researched cutoffs (see the table below) — this section is a much lower-resolution approximation of that idea, not a substitute for those instruments."],
["Expanded Domains (22 items)","Entirely original content. Executive function, emotional regulation, and hyperfocus/reward sensitivity are not part of DSM-5-TR's diagnostic criteria for ADHD, and no validated cutoff exists for the way they're measured here."],
["Word Balloons (24 words)","An original word-selection activity. It is not a validated implicit-association test of any kind — real IAT methodology requires forced binary choice under controlled millisecond timing, which this doesn't replicate."]
],

sourcesRealDesc:"These are the actual, published, clinically-used tools for each area. If anxiety, mood, sleep, or ADHD itself feels like a real concern, ask a clinician for these directly — they're free to use clinically, take a few minutes each, and are far more accurate than the informal sections above.",

["ASRS v1.1 (adult ADHD)","6-item Part A screener (subset of an 18-item scale)","4 of 6 items at or above threshold = positive screen"],
["GAD-7 (anxiety)","7 items, 0-21 range","Score of 10 or higher = clinically significant anxiety"],

["ISI (insomnia)","7 items, 0-28 range","Score of 15 or higher = moderate-to-severe clinical insomnia"]
],
sourcesNuanceTitle:"An honest note on the DSM-5 threshold itself",
sourcesNuanceText:"The official DSM-5-TR criterion (5 of 9 symptoms per domain, used in this tool) is the codified clinical standard. Separate research studies have explored whether a different, asymmetric cutoff predicts real-world impairment more precisely — but those studies disagree with each other on the exact numbers (one found 5 inattention / 4 hyperactivity, another found 5 inattention / 3 hyperactivity), and the reported specificity for the inattention cutoff in one such study was only about 50% — meaning roughly half of people who cross that threshold wouldn't actually have clinically significant impairment. This tool uses the official, codified threshold rather than picking one of the competing research alternatives.",

autismDisclaimer:"Autism's actual diagnostic structure is different from ADHD's. It's not a frequency count — it requires difficulty across all three social-communication areas below, plus at least two of the four restricted/repetitive-behavior categories. This tool follows that same logic rather than a simple item count, which is why the scoring here works differently from the ADHD sections.",

noClaimText:"AVIDAA FOCUS doet geen medische, diagnostische of therapeutische claims van welke aard dan ook. Het is een onafhankelijke, informele zelfbewustzijnstool, geen erkend instrument, geen zorgproduct, en geen vervanging voor professionele evaluatie. Door het te gebruiken ga je ermee akkoord dat AVIDAA en de maker geen verantwoordelijkheid of aansprakelijkheid dragen voor enige beslissing, actie, diagnose, of uitkomst verbonden aan het gebruik ervan — de resultaten zijn aan jou om te interpreteren, en elke medische beslissing hoort tussen jou en een bevoegde clinicus.",

sourcesTitle:"Bronnen & Methodologie",
sourcesDesc:"Een eerlijk overzicht van wat in deze tool gebaseerd is op gepubliceerd onderzoek, en wat originele inhoud is die daaromheen is gebouwd — zodat jij, en elke clinicus aan wie je dit laat zien, precies weet hoeveel gewicht elk onderdeel verdient.",
sourcesBasisTitle:"Waarop elk onderdeel is gebaseerd",
sourcesBasisCol1:"Onderdeel", sourcesBasisCol2:"Basis",
sourcesBasisRows:[
["Reflectie (18 items)","De itemformulering is origineel, in gewone taal geschreven — niet overgenomen van een erkend instrument. De structuur (9 aandachtstekort-/9 hyperactiviteit-impulsiviteit-items) en de markeringsdrempel (5 van de 9 per domein) komen overeen met de DSM-5-TR's eigen gepubliceerde diagnostische criteria voor volwassenen."],
["Jeugdpatronen (10 items)","Originele formulering. DSM-5-TR vereist symptomen die al in de jeugd begonnen zijn voor een diagnose, maar stelt geen specifieke item-drempel voor retrospectieve herinnering — de markeringsdrempel hier (5 van de 10) is een informeel middelpunt, geen gepubliceerde afkapwaarde."],
["Andere Mogelijke Oorzaken (12 items)","Originele 3-item-analogen voor angst, stemming, slaap en andere patronen. Echte gevalideerde screeners voor elk van deze aandoeningen gebruiken 7-9 items en hebben vastgestelde, onderzochte afkapwaarden (zie de tabel hieronder) — dit onderdeel is een veel grovere benadering van dat idee, geen vervanging voor die instrumenten."],
["Uitgebreide Domeinen (22 items)","Volledig originele inhoud. Executieve functies, emotieregulatie en hyperfocus/prikkelgevoeligheid maken geen deel uit van de DSM-5-TR diagnostische criteria voor ADHD, en er bestaat geen gevalideerde afkapwaarde voor de manier waarop ze hier gemeten worden."],
["Woordballonnen (24 woorden)","Een originele woordselectie-activiteit. Het is geen erkende impliciete-associatietest van welke aard dan ook — echte IAT-methodologie vereist een gedwongen binaire keuze onder gecontroleerde milliseconde-timing, wat dit niet nabootst."]
],
sourcesRealTitle:"Ter vergelijking: de echte gevalideerde instrumenten",
sourcesRealDesc:"Dit zijn de daadwerkelijke, gepubliceerde, klinisch gebruikte tools voor elk gebied. Als angst, stemming, slaap, of ADHD zelf als een echte zorg aanvoelt, vraag een clinicus dan rechtstreeks naar deze instrumenten — ze zijn vrij te gebruiken in de klinische praktijk, kosten elk een paar minuten, en zijn veel nauwkeuriger dan de informele onderdelen hierboven.",
sourcesRealCol1:"Instrument", sourcesRealCol2:"Structuur", sourcesRealCol3:"Gepubliceerde klinische afkapwaarde",

sourcesNuanceTitle:"Een eerlijke noot over de DSM-5-drempel zelf",
sourcesNuanceText:"Het officiële DSM-5-TR criterium (5 van de 9 symptomen per domein, gebruikt in deze tool) is de gecodificeerde klinische standaard. Afzonderlijke onderzoeken hebben verkend of een andere, asymmetrische afkapwaarde reële functionele beperking preciezer voorspelt — maar die onderzoeken zijn het onderling oneens over de exacte getallen (het ene vond 5 aandachtstekort/4 hyperactiviteit, het andere vond 5 aandachtstekort/3 hyperactiviteit), en de gerapporteerde specificiteit voor de aandachtstekort-afkapwaarde in één zo'n onderzoek was slechts ongeveer 50% — wat betekent dat ongeveer de helft van de mensen die deze drempel overschrijden, in werkelijkheid geen klinisch significante beperking zouden hebben. Deze tool gebruikt de officiële, gecodificeerde drempel in plaats van een van de concurrerende onderzoeksalternatieven te kiezen.",

timerCaveat:"Dit is een informele voltooiingstijd-notitie, geen klinische timed test — echte aandachts-/verwerkingssnelheidstests (zoals een Continuous Performance Test) vereisen gecontroleerde, milliseconde-precieze omstandigheden die dit niet kan nabootsen. Een erg snelle of erg trage tijd hier kan net zo goed wijzen op onderbreking of afleiding tijdens het invullen als op iets klinisch.",
navAutism:"Autisme Vergelijking",
autismTitle:"Autisme Vergelijking",
autismDesc:"ADHD en autisme overlappen sterk en komen vaak samen voor — tot 50-70% van autistische volwassenen voldoet ook aan ADHD-criteria. Dit gedeelte screent op autisme-geassocieerde patronen met dezelfde gewone-taal-aanpak als de rest van deze tool, zodat je beide patronen naast elkaar kunt zien in plaats van één vage gecombineerde indruk.",
autismDisclaimer:"De werkelijke diagnostische structuur van autisme verschilt van die van ADHD. Het is geen frequentietelling — het vereist moeite op alle drie de sociale-communicatiegebieden hieronder, plus minstens twee van de vier categorieën beperkt/repetitief gedrag. Deze tool volgt diezelfde logica in plaats van een simpele itemtelling, wat is waarom de scoring hier anders werkt dan bij de ADHD-gedeelten.",

autismDomainBDesc:"Echte diagnostische criteria vereisen dat minstens twee van deze vier categorieën (repetitieve beweging/spraak, aandringen op hetzelfde, beperkte interesses, sensorische reactiviteit) aanwezig zijn.",

expandTitle:"Dominio Ekstendí",
expandDesc:"Tres dominio klíniko real mas afó di e kriterio prinsipal: funshon ehekutivo (planiamentu, sigui-hasta-kaba), regulashon emoshonal (toleransia pa frustrashon, sensibilidat pa rechaso), i hiperfokus/sensibilidat pa stímulo. Nan ta wòrdu diskutí hopi biaha huntu ku ADHD pero nan no ta parti di e kriterio diagnóstiko prinsipal mes — kontèkstu útil, no peso diagnóstiko ekstra.",

expandLine:(label,n,of)=>`${label}: ${n} for di ${of} markeá "hopi biaha" òf "mashá hopi biaha."`,
expandFootnote:"Difikultat ku funshon ehekutivo i regulashon emoshonal ta komun den ADHD pero no ta eksklusivo na dje. Patronnan di hiperfokus i sensibilidat pa stímulo no ta nesesariamente un problema — nan ta un karakterístika bal la pena menshoná na un doktor tòch, pasombra nan ta forma kon ADHD (si presente) realmente ta parse kada dia.",

overviewFootnote:"E limitenan mustrá aki (5+ for di 9 pa e dominionan prinsipal di ADHD, mas o ménos mitar di e puntonan pa otro) ta punto medio informal pa stimulá reflekshon — no limite klíniko validá. Solamente un evaluashon klíniko strukturá ta diagnóstiko.",

function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function t(key){return UI[currentLang][key];}

function timerTouch(section){
  if(!timerState[section]) timerState[section]={start:null,last:null};
  if(!timerState[section].start){
    timerState[section].start = Date.now();
    localStorage.setItem('af_timers', JSON.stringify(timerState));
  }
}
function timerStop(section){
  if(!timerState[section] || !timerState[section].start) return timerState[section]?.last ?? null;
  const elapsed = Math.round((Date.now()-timerState[section].start)/1000);
  timerState[section].last = elapsed;
  timerState[section].start = null;
  localStorage.setItem('af_timers', JSON.stringify(timerState));
  return elapsed;
}
function timerReset(section){
  timerState[section] = {start:null,last:null};
  localStorage.setItem('af_timers', JSON.stringify(timerState));
}
function formatDuration(sec){
  if(sec===null || sec===undefined) return null;
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function timerLine(section){
  const sec = timerState[section]?.last;
  const d = formatDuration(sec);
  if(!d) return '';
  return `<p class="small">${t('timerLabel')(d)} ${t('timerCaveat')}</p>`;
}

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('af_lang', lang);
  document.getElementById('htmlRoot').lang = lang;
  document.querySelectorAll('.langtab').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  renderAllText();
}

function renderAllText(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(UI[currentLang][key] !== undefined) el.innerHTML = UI[currentLang][key];
  });
  document.getElementById('howToList').innerHTML = UI[currentLang].howTo.map(x=>`<li>${escHtml(x)}</li>`).join('');
  document.getElementById('diagTable').innerHTML = UI[currentLang].diagRows.map(([a,b])=>`<tr><td><b>${escHtml(a)}</b></td><td>${escHtml(b)}</td></tr>`).join('');
  document.getElementById('inattList').innerHTML = UI[currentLang].inattList.map(x=>`<li>${escHtml(x)}</li>`).join('');
  document.getElementById('hypList').innerHTML = UI[currentLang].hypList.map(x=>`<li>${escHtml(x)}</li>`).join('');

function domainStatus(items, answers, threshold){
  const answered = items.filter(([id])=>answers[id]!==undefined).length;
  if(answered===0) return {state:'none', text:t('overviewNotStarted')};
  const high = items.filter(([id])=>answers[id]!==undefined && parseInt(answers[id])>=2).length;
  const partial = answered < items.length;
  const scale = SCALE_I18N[currentLang];
  const resultText = `${high}/${items.length} ${scale[2][1].toLowerCase()}+`;
  return { state: high>=threshold ? 'flag' : 'ok', partial, text: resultText, flagged: high>=threshold };
}
/* ================= PRINTABLE TODO SHEET ================= */
const TODO_CATS = ['task','reminder','appointment'];
const TODO_PRIS = ['high','medium','low'];
const DEFAULT_CONTEXTS = ['bank','home','office','online'];
const CURRENCIES = {USD:'$', EUR:'€', GBP:'£', ANG:'ƒ', OTHER:''};
function todoCatLabel(cat){ return t('todoCats')[cat]; }
function todoPriLabel(pri){ return t('todoPris')[pri]; }
function todoContextLabel(ctx){ return t('todoContexts')[ctx] || ctx; }
function currencySymbol(){ return CURRENCIES[todoCurrency] !== undefined ? CURRENCIES[todoCurrency] : ''; }
function formatTimeAMPM(hhmm){
  if(!hhmm) return '';
  const [h,m] = hhmm.split(':').map(Number);
  const period = h>=12 ? 'PM' : 'AM';
  let hour12 = h%12; if(hour12===0) hour12=12;
  return `${hour12}:${String(m).padStart(2,'0')} ${period}`;
}
function formatTimeRange(from,to){
  if(from && to) return `${formatTimeAMPM(from)} – ${formatTimeAMPM(to)}`;
  if(from) return formatTimeAMPM(from);
  if(to) return formatTimeAMPM(to);
  return '';
}
function formatAmount(amount){
  if(amount===undefined || amount===null || amount==='' || isNaN(amount)) return '';
  return `${currencySymbol()}${parseFloat(amount).toFixed(2)}`;
}

  return items.filter(item=>{
    if(todoFilters.cat!=='all' && item.cat!==todoFilters.cat) return false;

    return true;

function sortTodos(items){
  const priRank = {high:0, medium:1, low:2};
  return items.slice().sort((a,b)=>{
    if(priRank[a.pri] !== priRank[b.pri]) return priRank[a.pri]-priRank[b.pri];
    if(a.date && b.date && a.date!==b.date) return a.date < b.date ? -1 : 1;
    if(a.date && !b.date) return -1;
    if(!a.date && b.date) return 1;
    const at = a.timeFrom || a.timeTo || '';
    const bt = b.timeFrom || b.timeTo || '';
    if(at && bt && at!==bt) return at < bt ? -1 : 1;
    if(at && !bt) return -1;
    if(!at && bt) return 1;
    return 0;
  });
}

function printTodo(){
  const filtered = applyTodoFilters(todoItems);
  if(filtered.length===0){ alert(t('todoEmpty')); return; }
  document.getElementById('psTitle').textContent = t('todoSheetTitle');
  document.getElementById('psDate').textContent = t('todoSheetGenerated')(new Date().toLocaleDateString());
  const sorted = sortTodos(filtered);
  const allContexts = DEFAULT_CONTEXTS.concat(customContexts);

      rows.push(['autism', {state:(autismSocialFlag||autismBehaviorFlag)?'flag':'ok', flagged:(autismSocialFlag||autismBehaviorFlag), partial, text:`${answeredA+answeredB}/${AI_A.length+AI_B.length}`}]);

function drawTrendChart(){
  const cv = document.getElementById('trendChart');
  if(!cv) return;
  const parentWidth = cv.parentElement.clientWidth || 600;
  cv.width = parentWidth; cv.height = 160;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const isDark = document.body.getAttribute('data-theme')==='dark';
  ctx.fillStyle = isDark? '#9795b8' : '#5b5875';
  ctx.font = '11px Inter, sans-serif';
  if(entries.length===0){
    ctx.fillText(t('chartNoData'), 12, 84);
    return;
  }
  const data = entries.slice(0,20).slice().reverse();
  const padL=28,padR=12,padT=12,padB=20;
  const plotW = cv.width - padL - padR;
  const plotH = cv.height - padT - padB;
  ctx.strokeStyle = isDark? '#2a2f52' : '#d7d4e8';
  ctx.lineWidth=1;
  for(let gy=0; gy<=10; gy+=2){
    const y = padT + plotH - (gy/10)*plotH;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cv.width-padR,y); ctx.stroke();
    ctx.fillText(gy, 6, y+3);
  }
  function plotLine(key,color){
    ctx.strokeStyle = color; ctx.lineWidth=2; ctx.beginPath();
    data.forEach((e,i)=>{
      const x = padL + (data.length===1? plotW/2 : (i/(data.length-1))*plotW);
      const val = parseFloat(e[key]);
      const y = padT + plotH - (val/10)*plotH;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    data.forEach((e,i)=>{
      const x = padL + (data.length===1? plotW/2 : (i/(data.length-1))*plotW);
      const val = parseFloat(e[key]);
      const y = padT + plotH - (val/10)*plotH;
      ctx.beginPath(); ctx.fillStyle=color; ctx.arc(x,y,2.5,0,Math.PI*2); ctx.fill();
    });
  }
  plotLine('focus', '#5cc9b0');
  plotLine('frust', '#e2765f');
}
addEventListener('resize', ()=>drawTrendChart());

let balloons = [];
let balloonAnimId = null;
let balloonCanvasEl = null;

function isCalm(){ return document.body.getAttribute('data-calm')==='on' || window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

function selectWordId(id){
  timerTouch('balloon');
  if(!balloonSelected.includes(id)){
    balloonSelected.push(id);
    localStorage.setItem('af_balloon_selected', JSON.stringify(balloonSelected));
  }
  updateBalloonLiveCount();
}
function toggleWordId(id){
  timerTouch('balloon');
  const pos = balloonSelected.indexOf(id);
  let nowSelected;
  if(pos>=0){ balloonSelected.splice(pos,1); nowSelected=false; }
  else { balloonSelected.push(id); nowSelected=true; }
  localStorage.setItem('af_balloon_selected', JSON.stringify(balloonSelected));
  updateBalloonLiveCount();
  return nowSelected;
}
function updateBalloonLiveCount(){
  const words = WORD_BANK_I18N[currentLang];
  const pos = words.filter(([id,txt,type])=>type==='pos' && balloonSelected.includes(id)).length;
  const neg = words.filter(([id,txt,type])=>type==='neg' && balloonSelected.includes(id)).length;
  const el = document.getElementById('balloonLiveCount');
  if(el) el.textContent = t('balloonLine')(pos,neg);
}

function initBalloonMode(){
  const canvas = document.getElementById('balloonCanvas');
  const chips = document.getElementById('balloonChips');
  const hint = document.getElementById('balloonStaticHint');
  if(isCalm()){
    canvas.style.display='none'; hint.style.display='block'; chips.style.display='grid';
    if(balloonAnimId){ cancelAnimationFrame(balloonAnimId); balloonAnimId=null; }
    renderBalloonChips();
  } else {
    canvas.style.display='block'; hint.style.display='none'; chips.style.display='none';
    startBalloonCanvas();
  }
  updateBalloonLiveCount();
}
function renderBalloonChips(){
  const chips = document.getElementById('balloonChips');
  const words = WORD_BANK_I18N[currentLang].slice();
  // stable shuffle by id so order doesn't change on re-render, but is mixed pos/neg

    chips.appendChild(b);
  });
}
function recordExposure(id){
  if(!wordStats[id]) wordStats[id] = {exposures:0, pops:0, totalMs:0};
  wordStats[id].exposures++;
  localStorage.setItem('af_word_stats', JSON.stringify(wordStats));
}
function recordPop(id, responseMs){
  if(!wordStats[id]) wordStats[id] = {exposures:0, pops:0, totalMs:0};
  wordStats[id].pops++;
  if(responseMs!=null) wordStats[id].totalMs += responseMs;
  localStorage.setItem('af_word_stats', JSON.stringify(wordStats));
}
function spawnBalloonObj(canvas){
  const words = WORD_BANK_I18N[currentLang];
  const w = words[Math.floor(Math.random()*words.length)];
  recordExposure(w[0]);
  return {
    id: w[0], text: w[1],
    x: 40 + Math.random()*(canvas.width-80),
    y: canvas.height + 30,
    vy: 0.35 + Math.random()*0.5,
    phase: Math.random()*Math.PI*2,
    amp: 8 + Math.random()*10,
    popping: 0,
    spawnTime: performance.now()
  };
}
function startBalloonCanvas(){
  const canvas = document.getElementById('balloonCanvas');
  if(!canvas) return;
  canvas.width = canvas.clientWidth; canvas.height = 320;
  const ctx = canvas.getContext('2d');
  balloonCanvasEl = canvas;
  if(balloons.length===0){
    for(let i=0;i<7;i++){ const b = spawnBalloonObj(canvas); b.y = canvas.height - i*40 - Math.random()*40; balloons.push(b); }
  }
  if(!canvas.dataset.bound){
    canvas.addEventListener('click', onBalloonClick);
    canvas.dataset.bound = '1';
  }
  if(balloonAnimId) cancelAnimationFrame(balloonAnimId);
  let t=0;
  function draw(){
    if(isCalm()){ balloonAnimId=null; return; }
    t+=0.02;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const isDark = document.body.getAttribute('data-theme')==='dark';
    balloons.forEach(b=>{
      if(b.popping>0){
        b.popping++;
        const r = 30 + b.popping*3;
        ctx.beginPath();
        ctx.strokeStyle = isDark? 'rgba(231,181,101,'+(1-b.popping/16)+')' : 'rgba(184,134,47,'+(1-b.popping/16)+')';
        ctx.lineWidth=2;
        ctx.arc(b.x,b.y,r,0,Math.PI*2); ctx.stroke();
        if(b.popping>16){
          Object.assign(b, spawnBalloonObj(canvas));
        }
        return;
      }
      b.y -= b.vy;
      const wobbleX = b.x + Math.sin(t+b.phase)*b.amp*0.05;
      if(b.y < -40){ Object.assign(b, spawnBalloonObj(canvas)); return; }
      ctx.beginPath();
      const grad = ctx.createRadialGradient(wobbleX-10, b.y-14, 2, wobbleX, b.y, 40);
      if(isDark){ grad.addColorStop(0,'#2a3a6a'); grad.addColorStop(1,'#171b32'); }
      else { grad.addColorStop(0,'#ffffff'); grad.addColorStop(1,'#ddd9ee'); }
      ctx.fillStyle = grad;
      ctx.ellipse(wobbleX, b.y, 34, 42, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = isDark? 'rgba(92,201,176,.5)' : 'rgba(46,138,118,.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.strokeStyle = isDark? '#3a3f66':'#b7b3d4';
      ctx.moveTo(wobbleX, b.y+42); ctx.lineTo(wobbleX, b.y+58); ctx.stroke();
      ctx.fillStyle = isDark? '#e9e7f5' : '#201f35';
      ctx.font = '11px "Space Grotesk", sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.text, wobbleX, b.y, 58);
    });
    balloonAnimId = requestAnimationFrame(draw);
  }
  draw();
}
function onBalloonClick(e){
  const canvas = balloonCanvasEl;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
  const cx = (e.clientX-rect.left)*scaleX, cy = (e.clientY-rect.top)*scaleY;
  for(const b of balloons){
    if(b.popping>0) continue;
    const dx=cx-b.x, dy=cy-b.y;
    if(Math.sqrt(dx*dx+dy*dy) < 40){
      b.popping = 1;
      const responseMs = performance.now() - b.spawnTime;
      recordPop(b.id, responseMs);
      selectWordId(b.id);
      break;
    }
  }
}
function scoreBalloon(){
  timerStop('balloon');
  const words = WORD_BANK_I18N[currentLang];
  const pos = words.filter(([id,txt,type])=>type==='pos' && balloonSelected.includes(id)).length;
  const neg = words.filter(([id,txt,type])=>type==='neg' && balloonSelected.includes(id)).length;
  const flagged = pos>=7 && pos>neg;
  const deep = computeBalloonDepth(words);
  const box = document.getElementById('balloonResult');
  box.innerHTML = `
    <div class="resultbox ${flagged?'flag':''}">
      <h3>${t('balloonResultTitle')}</h3>
      <p>${t('balloonLine')(pos,neg)}</p>
      <p class="small">${flagged? t('balloonFlagged') : t('balloonNotFlagged')}</p>
      ${deep ? `<p class="small">${escHtml(deep.consistencyLine)}</p><p class="small">${escHtml(deep.speedLine)}</p>` : `<p class="small">${t('balloonNoDeepData')}</p>`}
      ${timerLine('balloon')}
      <p class="small">${t('balloonFootnote')}</p>
    </div>`;
}
function computeBalloonDepth(words){
  // Only meaningful once at least one word has been through the canvas
  // respawn cycle (exposures>0) -- static chip mode alone won't populate this.
  const withData = words.filter(([id])=>wordStats[id] && wordStats[id].exposures>0);
  if(withData.length===0) return null;
  function categoryStats(type){
    const items = withData.filter(([id,txt,t2])=>t2===type);
    const repeated = items.filter(([id])=>wordStats[id].exposures>=2);
    let consistencySum=0, consistencyCount=0, speedSum=0, speedCount=0;
    repeated.forEach(([id])=>{
      const s = wordStats[id];
      consistencySum += s.pops/s.exposures; consistencyCount++;
    });
    items.forEach(([id])=>{
      const s = wordStats[id];
      if(s.pops>0){ speedSum += s.totalMs/s.pops; speedCount++; }
    });
    return {
      consistency: consistencyCount>0 ? Math.round((consistencySum/consistencyCount)*100) : null,
      avgSpeed: speedCount>0 ? Math.round(speedSum/speedCount) : null,
      repeatedCount: repeated.length
    };
  }
  const posStats = categoryStats('pos'), negStats = categoryStats('neg');
  let consistencyLine, speedLine;
  if(posStats.consistency!=null || negStats.consistency!=null){
    consistencyLine = t('balloonConsistencyLine')(
      posStats.consistency ?? '—', posStats.repeatedCount,
      negStats.consistency ?? '—', negStats.repeatedCount
    );
  } else {
    consistencyLine = t('balloonConsistencyNone');
  }
  if(posStats.avgSpeed!=null && negStats.avgSpeed!=null){
    speedLine = t('balloonSpeedLine')(posStats.avgSpeed, negStats.avgSpeed);
  } else {
    speedLine = t('balloonSpeedNone');
  }
  return {consistencyLine, speedLine};
}

  RI.forEach(([id,text])=>{ out += `- ${text} : ${reflectAns[id]!==undefined? scale.find(s=>s[0]===reflectAns[id])[1] : t('notAnswered')}\n`; });
  out += `${t('reportSettingsAdult')}: ${adultSet}\n`;

  CI.forEach(([id,text])=>{ out += `- ${text} : ${childAns[id]!==undefined? scale.find(s=>s[0]===childAns[id])[1] : t('notAnswered')}\n`; });
